name: Build packages

# 两个包都是 PKGARCH:=all（纯脚本 + 前端资源），产物与架构无关，
# 所以用 x86/64 的 SDK 编出来的包可以直接装到 aarch64 路由器上。
#
# 同时出两种格式：
#   ipk —— OpenWrt 24.10 及以前（opkg）
#   apk —— OpenWrt 25.12 起（apk-tools，官方新格式）

on:
  push:
    branches: [main]
    paths:
      - 'pbr-lite/**'
      - 'luci-app-pbr-lite/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: ${{ matrix.fmt }} (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fmt: ipk
            sdk: "24.10.8"
          - fmt: apk
            sdk: "25.12.6"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装解压依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd build-essential libncurses-dev

      - name: 下载 OpenWrt SDK ${{ matrix.sdk }}
        run: |
          BASE="https://downloads.openwrt.org/releases/${{ matrix.sdk }}/targets/x86/64/"
          FILE=$(curl -fsSL "$BASE" | grep -oE 'openwrt-sdk-[^"<]*Linux-x86_64\.tar\.(zst|gz)' | head -1)
          if [ -z "$FILE" ]; then
            echo "::error::在 $BASE 找不到 x86/64 SDK"
            exit 1
          fi
          echo "下载 $FILE"
          curl -fsSL -o sdk.tar "$BASE$FILE"
          case "$FILE" in
            *.zst) tar --zstd -xf sdk.tar ;;
            *.gz)  tar -xzf sdk.tar ;;
          esac
          DIR=$(ls -d openwrt-sdk-* | head -1)
          echo "SDK_DIR=$PWD/$DIR" >> "$GITHUB_ENV"
          echo "解压到 $DIR"

      - name: 放入本地包
        run: |
          cd "$SDK_DIR"
          mkdir -p package/pbr-lite
          cp -r "$GITHUB_WORKSPACE/pbr-lite"          package/pbr-lite/
          cp -r "$GITHUB_WORKSPACE/luci-app-pbr-lite" package/pbr-lite/
          # 确认 SDK 能发现两个 Makefile（package/*/*/Makefile 是支持的布局）
          find package/pbr-lite -name Makefile -maxdepth 3

      - name: 更新 feeds
        run: |
          cd "$SDK_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 选中目标包
        run: |
          cd "$SDK_DIR"
          make defconfig
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_pbr-lite=m
          CONFIG_PACKAGE_luci-app-pbr-lite=m
          EOF
          make defconfig
          echo "--- 确认已选中 ---"
          grep -E 'CONFIG_PACKAGE_(pbr-lite|luci-app-pbr-lite)=' .config

      - name: 编译
        run: |
          cd "$SDK_DIR"
          # 必须写「全限定」目标 package/pbr-lite/<包名>/compile。
          # 只写 package/pbr-lite/compile 的话，中间那层目录没有 Makefile，
          # make 会走 subdir.mk 的 compile -> install，等于把 SDK 默认配置里
          # 所有包（几百个 kmod、curl、fail2ban…）全编一遍：实测多花 12 分钟，
          # bin/ 里多出 200 多 MB 无关包。
          make -j$(nproc) V=s \
            package/pbr-lite/pbr-lite/compile \
            package/pbr-lite/luci-app-pbr-lite/compile

      - name: 收集产物
        run: |
          cd "$SDK_DIR"
          mkdir -p "$GITHUB_WORKSPACE/out"
          # 只挑我们这两个包。bin/ 里可能有成百上千个别的包，不加名字过滤
          # 会把整棵产物树都塞进 artifact（一次 200+ MB）。
          find bin -type f \( -name '*.ipk' -o -name '*.apk' \) \
              \( -name 'pbr-lite*' -o -name 'luci-app-pbr-lite*' \) \
              -exec cp -v {} "$GITHUB_WORKSPACE/out/" \;
          echo "--- 产物 ---"
          ls -lh "$GITHUB_WORKSPACE/out/"
          # 两个包都必须编出来，少一个就是编译链路有问题，别悄悄放过
          for n in pbr-lite luci-app-pbr-lite; do
            ls "$GITHUB_WORKSPACE/out/" | grep -q "^$n[_-]" || { echo "::error::缺少 $n 包"; exit 1; }
          done

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: pbr-lite-${{ matrix.fmt }}
          path: out/*
          if-no-files-found: error

      - name: 附到 Release（仅 release 事件）
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
